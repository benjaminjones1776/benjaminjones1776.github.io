<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BYU Sustainability Lab</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;

            justify-content: center;
            font-family: "sans-serif";

            background-image: url("");
        }

        #ui-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: fixed;

            width: 600px;

            z-index: 500;
            max-height: 90vh;
            overflow-y: auto;
            background: rgb(250 2 2); padding: 20px;
            border-radius: 8px; font-family: Arial, sans-serif;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            color: #333;
        }

        h3 {
            text-align: center;
            color: #ffffff;
            margin-top: 2rem;
            z-index: 50;
        }

        .circle {
            width: 500px;
            height: 500px;
            background-color: #002e5d;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);

            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #ffffff;
            padding: 1.5rem;
            z-index: -1;
            pointer-events: none;
            position: fixed;
        }

    </style>

</head>
<body>

    <div class="circle"></div>

    <div id="ui-panel">
        <h3>BYU Sustainability Lab</h3>
    </div>

</body>
</html>
